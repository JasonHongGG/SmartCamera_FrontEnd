version: "3.9"

services:
  frontend:
    image: node:20
    working_dir: /app
    restart: unless-stopped
    volumes:
      - .:/app
      - /app/node_modules
    ports:
      - "4000:4000"
    environment:
      - NODE_ENV=production
      - PORT=4000
      - API_PROXY_TARGET=http://host.docker.internal:5000
    command: sh -c "npm install && npm run build && node server.js"